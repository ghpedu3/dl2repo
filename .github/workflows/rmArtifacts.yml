name: rmArtifacts
run-name: Remove artifact branches

on:
  workflow_dispatch

jobs:
  remove-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Remove artifact branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tmpfile="$(mktemp)"
          page=1

          while true; do
            branches_json="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/branches?per_page=100&page=${page}"
            )"

            jq -e 'type == "array"' >/dev/null <<<"$branches_json"

            count="$(jq 'length' <<<"$branches_json")"
            [ "$count" -eq 0 ] && break

            jq -r '.[].name' <<<"$branches_json" >>"$tmpfile"

            page=$((page + 1))
          done

          grep '^artifacts-' "$tmpfile" |
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue

            echo "Deleting ${branch}..."

            response=$(curl -sL -w "\n%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${branch}")
            
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" -ne 204 ]; then
              echo "Error deleting ${branch}: HTTP $http_code"
              echo "$body"
            else
              echo "Successfully deleted ${branch}"
            fi
          done

          rm -f "$tmpfile"

          echo "Artifact branch cleanup completed."
